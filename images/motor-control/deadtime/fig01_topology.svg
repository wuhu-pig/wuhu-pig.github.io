<text x="26.00" y="356.00" font-size="12.5" fill="#23333f" text-anchor="start" font-weight="normal" opacity="1.0" style="font-family:'Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Source Han Sans SC',sans-serif">同一个桥臂的上下两管绝不能同时导通 —— 它们必须“错开”一段时间，</text>
<text x="26.00" y="376.00" font-size="12.5" fill="#23333f" text-anchor="start" font-weight="normal" opacity="1.0" style="font-family:'Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Source Han Sans SC',sans-serif">这段强制“双关断”的时间就是死区时间 Td。死区保证了安全，但也带来了下一节要讲的死区效应。</text>
<text x="26.00" y="404.00" font-size="11" fill="#6a7a88" text-anchor="start" font-weight="normal" opacity="1.0" style="font-family:'Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Source Han Sans SC',sans-serif">（b 图中红色粗线即直通短路电流：+Vdc → S1 → S2 → −Vdc。回路里只剩器件极小的导通电阻，电流会在几微秒内冲到上千安培，功率器件瞬间炸裂。）</text>
