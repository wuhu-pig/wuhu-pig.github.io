<text x="50.00" y="388.00" font-size="11.5" fill="#6a7a88" text-anchor="start" font-weight="normal" opacity="1.0" style="font-family:'Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Source Han Sans SC',sans-serif">两种完全等价的写法（实现时任选其一）：</text>
<text x="50.00" y="414.00" font-size="12.5" fill="#23333f" text-anchor="start" font-weight="bold" opacity="1.0" style="font-family:'Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Source Han Sans SC',sans-serif">① 电压补偿：  v*_comp = v* + Vc · sgn(i)        ② 占空比补偿：  d_comp = d + (Td / Ts) · sgn(i)</text>
<text x="50.00" y="440.00" font-size="10.5" fill="#6a7a88" text-anchor="start" font-weight="normal" opacity="1.0" style="font-family:'Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Source Han Sans SC',sans-serif">Vc = Vdc · Td / Ts = 6 V（本页例子）；Vdc 变化时要按实测母线电压重新算，否则补偿量会跟着母线电压一起漂。</text>
<text x="30.00" y="492.00" font-size="11.5" fill="#23333f" text-anchor="start" font-weight="normal" opacity="1.0" style="font-family:'Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Source Han Sans SC',sans-serif">载波比较的实现：比较电平抬高/降低 Td/Ts，脉宽就正好加宽/缩窄 Td —— 把死区吃掉的那一段补回来。</text>
